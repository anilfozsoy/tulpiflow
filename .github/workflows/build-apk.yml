name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build Debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd 06_App_TulpiFlow/tulpiflow_app/android || cd tulpiflow_app/android || cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TulpiFlow-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'

      - name: Publish GitHub Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE=$(find . -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" ./TulpiFlow.apk
            gh release create v1.3.0 ./TulpiFlow.apk --title "TulpiFlow v1.3.0" --notes "TulpiFlow v1.3.0 release from commit $GITHUB_SHA" || gh release upload v1.3.0 ./TulpiFlow.apk --clobber
          else
            echo "No APK found to publish"
          fi
